    <rect x="376" y="662" width="200" height="12" rx="4" fill="#4d6873"/>
    <circle cx="376" cy="702" r="8" fill="none" stroke="#6b8a95" stroke-width="2"/>
    <rect x="404" y="696" width="12" height="12" rx="2" fill="none" stroke="#6b8a95" stroke-width="2"/>

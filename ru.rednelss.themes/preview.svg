    <rect x="320" y="64" width="704" height="56" fill="#0d0b14"/>
    <line x1="320" y1="120" x2="1024" y2="120" stroke="#2a2538"/>
    <circle cx="352" cy="92" r="10" fill="#a855f7"/>
    <rect x="376" y="86" width="160" height="12" rx="4" fill="#e9e6f0"/>
    <rect x="856" y="80" width="36" height="24" rx="12" fill="#1c1928"/>
    <circle cx="874" cy="92" r="5" fill="#8b85a0"/>
    <rect x="904" y="80" width="36" height="24" rx="12" fill="#2d1b47"/>
    <circle cx="922" cy="92" r="5" fill="#a855f7"/>
    <rect x="952" y="80" width="36" height="24" rx="12" fill="#1c1928"/>
    <circle cx="970" cy="92" r="5" fill="#8b85a0"/>

    <!-- Remote message -->
    <rect x="368" y="160" width="440" height="96" rx="8" fill="#1c1928"/>
    <rect x="392" y="184" width="200" height="12" rx="4" fill="#e9e6f0"/>
    <rect x="392" y="208" width="360" height="10" rx="4" fill="#8b85a0"/>
    <rect x="392" y="228" width="280" height="10" rx="4" fill="#8b85a0"/>

    <!-- Own message -->
    <rect x="496" y="288" width="480" height="96" rx="8" fill="#2d1b47"/>
    <rect x="496" y="288" width="4" height="96" rx="2" fill="#a855f7"/>
    <rect x="520" y="312" width="240" height="12" rx="4" fill="#f5f3ff"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <!-- Seam gradient: violet → cyan -->
    <linearGradient id="seamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Midnight Violet accent gradient -->
    <linearGradient id="mvAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="mvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Abyss accent gradient -->
    <linearGradient id="abAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="abGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Clips for diagonal split (TL → BR) -->
    <clipPath id="clipViolet">
      <polygon points="0,0 1024,0 1024,768"/>
    </clipPath>
    <clipPath id="clipAbyss">
      <polygon points="0,0 0,768 1024,768"/>
    </clipPath>
  </defs>

  <!-- ================= MIDNIGHT VIOLET (upper-right triangle) ================= -->
  <g clip-path="url(#clipViolet)">
    <rect width="1024" height="768" fill="#13111c"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="1024" height="64" fill="#0d0b14"/>
    <line x1="0" y1="64" x2="1024" y2="64" stroke="#2a2538"/>
    <circle cx="40" cy="32" r="12" fill="url(#mvAccent)"/>
    <circle cx="40" cy="32" r="20" fill="url(#mvGlow)"/>
    <rect x="72" y="20" width="240" height="24" rx="4" fill="#8b85a0"/>
    <rect x="940" y="30" width="12" height="2" fill="#8b85a0"/>
    <rect x="970" y="24" width="12" height="12" rx="1" fill="none" stroke="#8b85a0" stroke-width="2"/>
    <path d="M995 25 L1007 37 M1007 25 L995 37" stroke="#8b85a0" stroke-width="2"/>

    <!-- Sidebar -->
    <rect x="0" y="64" width="320" height="704" fill="#0d0b14"/>
    <line x1="320" y1="64" x2="320" y2="768" stroke="#2a2538"/>
    <rect x="16" y="88" width="288" height="36" rx="4" fill="#1c1928"/>
    <circle cx="36" cy="106" r="6" fill="none" stroke="#6b6680" stroke-width="2"/>
    <path d="M40 110 L45 115" stroke="#6b6680" stroke-width="2" stroke-linecap="round"/>
    <rect x="56" y="102" width="140" height="8" rx="4" fill="#6b6680"/>
    <rect x="16" y="148" width="90" height="10" rx="3" fill="#4a4658"/>
    <rect x="16" y="172" width="288" height="52" rx="6" fill="#2d1b47"/>
    <rect x="16" y="172" width="4" height="52" rx="2" fill="#a855f7"/>
    <circle cx="44" cy="198" r="12" fill="#a855f7"/>
    <rect x="68" y="192" width="160" height="12" rx="4" fill="#e9e6f0"/>
    <circle cx="44" cy="252" r="12" fill="#2a2538"/>
    <rect x="68" y="246" width="120" height="10" rx="4" fill="#8b85a0"/>
    <circle cx="44" cy="300" r="12" fill="#2a2538"/>
    <rect x="68" y="294" width="140" height="10" rx="4" fill="#8b85a0"/>
    <rect x="16" y="360" width="288" height="44" rx="22" fill="url(#mvAccent)"/>

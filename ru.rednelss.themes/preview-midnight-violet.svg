<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base window -->
  <rect width="1024" height="768" fill="#13111c"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1024" height="64" fill="#0d0b14"/>
  <line x1="0" y1="64" x2="1024" y2="64" stroke="#2a2538"/>
  <circle cx="40" cy="32" r="12" fill="url(#accentGrad)"/>
  <circle cx="40" cy="32" r="20" fill="url(#glow)"/>
  <rect x="72" y="20" width="240" height="24" rx="4" fill="#8b85a0"/>
  <!-- Window controls -->
  <rect x="940" y="30" width="12" height="2" fill="#8b85a0"/>
  <rect x="970" y="24" width="12" height="12" rx="1" fill="none" stroke="#8b85a0" stroke-width="2"/>
  <path d="M995 25 L1007 37 M1007 25 L995 37" stroke="#8b85a0" stroke-width="2"/>

  <!-- Sidebar -->
  <rect x="0" y="64" width="320" height="704" fill="#0d0b14"/>
  <line x1="320" y1="64" x2="320" y2="768" stroke="#2a2538"/>

  <!-- Sidebar: search bar -->
  <rect x="16" y="88" width="288" height="36" rx="4" fill="#1c1928"/>
  <circle cx="36" cy="106" r="6" fill="none" stroke="#6b6680" stroke-width="2"/>
  <path d="M40 110 L45 115" stroke="#6b6680" stroke-width="2" stroke-linecap="round"/>
  <rect x="56" y="102" width="140" height="8" rx="4" fill="#6b6680"/>

  <!-- Sidebar: section header -->
  <rect x="16" y="148" width="90" height="10" rx="3" fill="#4a4658"/>

  <!-- Selected item -->
  <rect x="16" y="172" width="288" height="52" rx="6" fill="#2d1b47"/>
  <rect x="16" y="172" width="4" height="52" rx="2" fill="#a855f7"/>
  <circle cx="44" cy="198" r="12" fill="#a855f7"/>
  <rect x="68" y="192" width="160" height="12" rx="4" fill="#e9e6f0"/>

  <!-- Inactive items -->
  <circle cx="44" cy="252" r="12" fill="#2a2538"/>
  <rect x="68" y="246" width="120" height="10" rx="4" fill="#8b85a0"/>

  <circle cx="44" cy="300" r="12" fill="#2a2538"/>
  <rect x="68" y="294" width="140" height="10" rx="4" fill="#8b85a0"/>

  <!-- Accent button in sidebar -->
  <rect x="16" y="360" width="288" height="44" rx="22" fill="url(#accentGrad)"/>
  <rect x="88" y="378" width="144" height="10" rx="4" fill="#f5f3ff"/>

  <!-- Contacts section -->
  <rect x="16" y="440" width="100" height="10" rx="3" fill="#4a4658"/>
  <circle cx="44" cy="482" r="12" fill="#2a2538"/>
  <circle cx="44" cy="482" r="4" fill="#34d399"/>
  <rect x="68" y="476" width="130" height="10" rx="4" fill="#8b85a0"/>

  <!-- Main content area -->
  <rect x="320" y="64" width="704" height="704" fill="#13111c"/>

  <!-- Content header -->
  <rect x="320" y="64" width="704" height="56" fill="#0d0b14"/>
  <line x1="320" y1="120" x2="1024" y2="120" stroke="#2a2538"/>
  <circle cx="352" cy="92" r="10" fill="#a855f7"/>
  <rect x="376" y="86" width="160" height="12" rx="4" fill="#e9e6f0"/>
  <!-- Tab pills -->
  <rect x="856" y="80" width="36" height="24" rx="12" fill="#1c1928"/>
  <circle cx="874" cy="92" r="5" fill="#8b85a0"/>
  <rect x="904" y="80" width="36" height="24" rx="12" fill="#2d1b47"/>
  <circle cx="922" cy="92" r="5" fill="#a855f7"/>
  <rect x="952" y="80" width="36" height="24" rx="12" fill="#1c1928"/>
  <circle cx="970" cy="92" r="5" fill="#8b85a0"/>

  <!-- Chat: remote message -->
  <rect x="368" y="160" width="440" height="96" rx="8" fill="#1c1928"/>
  <rect x="392" y="184" width="200" height="12" rx="4" fill="#e9e6f0"/>
  <rect x="392" y="208" width="360" height="10" rx="4" fill="#8b85a0"/>
  <rect x="392" y="228" width="280" height="10" rx="4" fill="#8b85a0"/>

  <!-- Chat: own message (accent left stripe) -->
  <rect x="496" y="288" width="480" height="96" rx="8" fill="#2d1b47"/>
  <rect x="496" y="288" width="4" height="96" rx="2" fill="#a855f7"/>
  <rect x="520" y="312" width="240" height="12" rx="4" fill="#f5f3ff"/>
  <rect x="520" y="336" width="400" height="10" rx="4" fill="#cbb8e8"/>
  <rect x="520" y="356" width="320" height="10" rx="4" fill="#cbb8e8"/>

  <!-- Chat: remote with mention -->
  <rect x="368" y="416" width="360" height="72" rx="8" fill="#1c1928"/>
  <rect x="392" y="438" width="120" height="10" rx="4" fill="#e9e6f0"/>
  <rect x="392" y="458" width="180" height="10" rx="4" fill="#c084fc"/>

  <!-- Chat input -->
  <rect x="352" y="640" width="640" height="88" rx="8" fill="#1c1928" stroke="#2a2538" stroke-width="2"/>
  <rect x="376" y="662" width="200" height="12" rx="4" fill="#6b6680"/>
  <!-- Emoji / attachment icons -->
  <circle cx="376" cy="702" r="8" fill="none" stroke="#8b85a0" stroke-width="2"/>
  <rect x="404" y="696" width="12" height="12" rx="2" fill="none" stroke="#8b85a0" stroke-width="2"/>
  <!-- Send button -->
  <circle cx="960" cy="684" r="20" fill="url(#accentGrad)"/>
  <path d="M952 684 L968 684 M962 676 L968 684 L962 692" stroke="#f5f3ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent glow behind window title -->
  <ellipse cx="512" cy="0" rx="512" ry="60" fill="url(#glow)"/>

  <!-- Accent border at very top (subtle signature) -->
  <rect x="0" y="0" width="1024" height="3" fill="url(#accentGrad)"/>
</svg>
